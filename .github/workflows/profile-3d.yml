name: Generate 3D Contribution Calendar

on:
  schedule:
    # Runs daily at 18:00 UTC (11:30 PM IST)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contribution Graph
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push Generated Graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update 3D profile contribution visualization [skip ci]"
          file_pattern: "profile-3d-contrib/*"
