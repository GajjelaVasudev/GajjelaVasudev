<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background and Accent Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120A2B" />
      <stop offset="45%" stop-color="#190B46" />
      <stop offset="100%" stop-color="#090417" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F7F7FB" />
      <stop offset="100%" stop-color="#DCD4F8" />
    </linearGradient>

    <linearGradient id="violetGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#762FF2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4C2ACB" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#762FF2" stop-opacity="0" />
      <stop offset="25%" stop-color="#762FF2" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#9D62FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#762FF2" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#762FF2" />
      <stop offset="100%" stop-color="#4C2ACB" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Architectural Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#762FF2" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="1.2" fill="#762FF2" fill-opacity="0.28" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Light / Glow Spheres -->
  <circle cx="1020" cy="80" r="160" fill="#762FF2" fill-opacity="0.22" filter="url(#violetGlow)" />
  <circle cx="160" cy="300" r="140" fill="#4C2ACB" fill-opacity="0.2" filter="url(#violetGlow)" />
  <circle cx="680" cy="220" r="110" fill="#9D62FF" fill-opacity="0.12" filter="url(#violetGlow)" />

  <!-- Container Border with subtle gradient -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#badgeBorderGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Corner Brackets (Architectural Blueprint details) -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#762FF2" stroke-width="2" stroke-linecap="round" />
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#762FF2" stroke-width="2" stroke-linecap="round" />
  <path d="M 24 316 L 24 336 L 44 336" fill="none" stroke="#762FF2" stroke-width="2" stroke-linecap="round" />
  <path d="M 1176 316 L 1176 336 L 1156 336" fill="none" stroke="#762FF2" stroke-width="2" stroke-linecap="round" />

  <!-- Left Content Area -->
  <g transform="translate(68, 64)">
    <!-- Status / Role Pill -->
    <g transform="translate(0, 0)">
      <rect width="320" height="30" rx="15" fill="#1A0D3D" stroke="#762FF2" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="4.5" fill="#10B981" />
      <circle cx="16" cy="15" r="7" fill="#10B981" fill-opacity="0.3" />
      <text x="32" y="19.5" fill="#E8E6F0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2">SYSTEMS &amp; BACKEND ENGINEER</text>
    </g>

    <!-- Main Headline / Name -->
    <text x="0" y="88" fill="url(#primaryTextGrad)" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      VASUDEV GAJJELA
    </text>

    <!-- Professional Tagline -->
    <text x="0" y="128" fill="#D1C4E9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500" letter-spacing="-0.2">
      Architecting high-concurrency backends, distributed systems &amp; intelligent applications.
    </text>

    <!-- Dynamic Architectural Line -->
    <rect x="0" y="152" width="620" height="2" fill="url(#accentLineGrad)" />

    <!-- Capability Tags / Pillar Pills -->
    <g transform="translate(0, 178)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="8" fill="#160B36" stroke="#4C2ACB" stroke-width="1" stroke-opacity="0.8" />
        <text x="69" y="20" fill="#F7F7FB" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Distributed Systems</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(148, 0)">
        <rect width="136" height="32" rx="8" fill="#160B36" stroke="#4C2ACB" stroke-width="1" stroke-opacity="0.8" />
        <text x="68" y="20" fill="#F7F7FB" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">ACID Transactions</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(294, 0)">
        <rect width="128" height="32" rx="8" fill="#160B36" stroke="#4C2ACB" stroke-width="1" stroke-opacity="0.8" />
        <text x="64" y="20" fill="#F7F7FB" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Redis &amp; Caching</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(432, 0)">
        <rect width="144" height="32" rx="8" fill="#160B36" stroke="#4C2ACB" stroke-width="1" stroke-opacity="0.8" />
        <text x="72" y="20" fill="#F7F7FB" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI &amp; Test Automation</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Geometry: System Nodes and Metrics Matrix -->
  <g transform="translate(860, 48)">
    <!-- Circuit Card Outer Frame -->
    <rect width="272" height="264" rx="14" fill="#140B33" fill-opacity="0.75" stroke="#762FF2" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Terminal Header Bar -->
    <rect width="272" height="36" rx="14" fill="#1E0F4B" fill-opacity="0.9" />
    <path d="M 0 24 L 0 36 L 272 36 L 272 24 Z" fill="#1E0F4B" fill-opacity="0.9" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="52" cy="18" r="4.5" fill="#10B981" fill-opacity="0.8" />
    <text x="148" y="22" fill="#E8E6F0" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill-opacity="0.8">vasudev@core-engine:~</text>

    <!-- Code Snippet / Architectural Blueprint inside terminal -->
    <g transform="translate(20, 56)">
      <!-- Line 1: Flagship -->
      <text x="0" y="16" fill="#A78BFA" font-family="monospace" font-size="11.5" font-weight="600">const flagship = "OMIZON";</text>
      
      <!-- Line 2: Stack -->
      <text x="0" y="38" fill="#9CA3AF" font-family="monospace" font-size="11">stack: [Node.js, Express, Mongo, Redis]</text>
      
      <!-- Line 3: Reliability -->
      <text x="0" y="60" fill="#34D399" font-family="monospace" font-size="11">✓ Multi-Doc ACID Transactions</text>
      
      <!-- Line 4: Security -->
      <text x="0" y="82" fill="#34D399" font-family="monospace" font-size="11">✓ Idempotent Webhook Engine</text>

      <!-- Line 5: Verification -->
      <text x="0" y="104" fill="#34D399" font-family="monospace" font-size="11">✓ Playwright AI Test Matrix</text>

      <!-- Highlight Metric Box -->
      <g transform="translate(0, 126)">
        <rect width="232" height="58" rx="8" fill="#1E0E52" stroke="#762FF2" stroke-width="1" stroke-opacity="0.6" />
        <text x="16" y="24" fill="#9D62FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">VERIFIED RECOGNITION</text>
        <text x="16" y="44" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">JPMorgan CFG '26 Runner-Up</text>
      </g>
    </g>
  </g>
</svg>
