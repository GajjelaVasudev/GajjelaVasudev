<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F0826" />
      <stop offset="100%" stop-color="#090417" />
    </linearGradient>
    <linearGradient id="barGreenHigh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#762FF2" />
      <stop offset="100%" stop-color="#4C2ACB" />
    </linearGradient>
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="420" rx="14" fill="url(#bg)" stroke="#2D1C68" stroke-width="1.5" />

  <!-- Title and Kicker -->
  <text x="36" y="44" fill="#9D62FF" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">ACTIVITY TELEMETRY &#8226; 3D PERSPECTIVE</text>
  <text x="36" y="68" fill="#F7F7FB" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Vasudev Gajjela's GitHub Contribution Landscape</text>

  <!-- Isometric Grid Transformation -->
  <g transform="translate(425, 230) scale(1, 0.52) rotate(-45)">
    <!-- Base Grid Lines -->
    <path d="M -240,-240 L 240,-240 L 240,240 L -240,240 Z" fill="#150B33" stroke="#762FF2" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Isometric Grid Cells -->
    <g stroke="#762FF2" stroke-width="0.75" stroke-opacity="0.18" fill="none">
      <path d="M -240,-160 L 240,-160 M -240,-80 L 240,-80 M -240,0 L 240,0 M -240,80 L 240,80 M -240,160 L 240,160" />
      <path d="M -160,-240 L -160,240 M -80,-240 L -80,240 M 0,-240 L 0,240 M 80,-240 L 80,240 M 160,-240 L 160,240" />
    </g>

    <!-- Isometric Contribution Blocks (Emerald and Electric Violet) -->
    <!-- Low Level Blocks -->
    <rect x="-200" y="-120" width="30" height="30" rx="3" fill="#064E3B" fill-opacity="0.8" stroke="#10B981" stroke-width="0.5" />
    <rect x="-160" y="-80" width="30" height="30" rx="3" fill="#047857" fill-opacity="0.9" stroke="#10B981" stroke-width="0.5" />
    <rect x="-120" y="-40" width="30" height="30" rx="3" fill="#10B981" />
    
    <!-- Clustered Active Sprint Blocks -->
    <rect x="-40" y="-40" width="32" height="32" rx="3" fill="#762FF2" stroke="#9D62FF" stroke-width="0.8" />
    <rect x="0" y="-40" width="32" height="32" rx="3" fill="#10B981" stroke="#34D399" stroke-width="0.8" />
    <rect x="0" y="0" width="32" height="32" rx="3" fill="#34D399" />
    <rect x="40" y="0" width="32" height="32" rx="3" fill="#10B981" />
    <rect x="80" y="0" width="32" height="32" rx="3" fill="#762FF2" />
    <rect x="80" y="40" width="32" height="32" rx="3" fill="#34D399" />
    <rect x="120" y="40" width="32" height="32" rx="3" fill="#10B981" />
    <rect x="120" y="80" width="32" height="32" rx="3" fill="#059669" />
    <rect x="160" y="80" width="32" height="32" rx="3" fill="#762FF2" />
    <rect x="160" y="120" width="32" height="32" rx="3" fill="#34D399" />
    <rect x="200" y="120" width="32" height="32" rx="3" fill="#10B981" />

    <!-- 3D Extruded Pillars (Representing High Commit Intensity) -->
    <!-- Pillar 1 -->
    <g transform="translate(40, -100)">
      <polygon points="0,0 24,-12 48,0 24,12" fill="#34D399" />
      <polygon points="0,0 24,12 24,60 0,48" fill="#059669" />
      <polygon points="24,12 48,0 48,48 24,60" fill="#047857" />
    </g>
    <!-- Pillar 2 (Flagship Sprint) -->
    <g transform="translate(100, -20)">
      <polygon points="0,0 28,-14 56,0 28,14" fill="#A78BFA" />
      <polygon points="0,0 28,14 28,90 0,76" fill="#762FF2" />
      <polygon points="28,14 56,0 56,76 28,90" fill="#4C2ACB" />
    </g>
    <!-- Pillar 3 -->
    <g transform="translate(60, 40)">
      <polygon points="0,0 24,-12 48,0 24,12" fill="#6EE7B7" />
      <polygon points="0,0 24,12 24,75 0,63" fill="#10B981" />
      <polygon points="24,12 48,0 48,63 24,75" fill="#059669" />
    </g>
  </g>

  <!-- Left Radar Chart / Telemetry Matrix -->
  <g transform="translate(68, 230)">
    <!-- Radar Web Lines -->
    <polygon points="0,-60 52,-20 32,50 -32,50 -52,-20" fill="none" stroke="#762FF2" stroke-width="1" stroke-opacity="0.3" />
    <polygon points="0,-40 35,-13 21,33 -21,33 -35,-13" fill="none" stroke="#762FF2" stroke-width="1" stroke-opacity="0.4" />
    <polygon points="0,-20 17,-7 10,16 -10,16 -17,-7" fill="none" stroke="#762FF2" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Active Radar Fill -->
    <polygon points="0,-52 42,-14 24,38 -26,42 -44,-16" fill="#10B981" fill-opacity="0.35" stroke="#34D399" stroke-width="1.8" filter="url(#radarGlow)" />
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-65" stroke="#762FF2" stroke-width="1" stroke-opacity="0.5" />
    <line x1="0" y1="0" x2="56" y2="-22" stroke="#762FF2" stroke-width="1" stroke-opacity="0.5" />
    <line x1="0" y1="0" x2="35" y2="54" stroke="#762FF2" stroke-width="1" stroke-opacity="0.5" />
    <line x1="0" y1="0" x2="-35" y2="54" stroke="#762FF2" stroke-width="1" stroke-opacity="0.5" />
    <line x1="0" y1="0" x2="-56" y2="-22" stroke="#762FF2" stroke-width="1" stroke-opacity="0.5" />

    <!-- Labels -->
    <text x="0" y="-72" fill="#E8E6F0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Commits</text>
    <text x="66" y="-18" fill="#E8E6F0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Repos</text>
    <text x="42" y="68" fill="#E8E6F0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Reviews</text>
    <text x="-42" y="68" fill="#E8E6F0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Issues</text>
    <text x="-66" y="-18" fill="#E8E6F0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="end">PRs</text>
  </g>

  <!-- Right Donut Language Distribution -->
  <g transform="translate(730, 230)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#150B33" stroke-width="18" />
    <!-- Segment TypeScript -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#3178C6" stroke-width="18" stroke-dasharray="140 200" stroke-dashoffset="0" />
    <!-- Segment Python -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#3776AB" stroke-width="18" stroke-dasharray="80 260" stroke-dashoffset="-140" />
    <!-- Segment JavaScript -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#F7DF1E" stroke-width="18" stroke-dasharray="60 280" stroke-dashoffset="-220" />
    <!-- Segment Java / C# -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#762FF2" stroke-width="18" stroke-dasharray="50 290" stroke-dashoffset="-280" />

    <!-- Center Legend Text -->
    <text x="0" y="4" fill="#F7F7FB" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Multi-Stack</text>
    <text x="0" y="19" fill="#9D62FF" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Production</text>
  </g>

  <!-- Bottom Metric Summary Bar -->
  <g transform="translate(36, 375)">
    <rect width="778" height="30" rx="8" fill="#140B33" stroke="#4C2ACB" stroke-width="1" stroke-opacity="0.6" />
    <text x="24" y="19.5" fill="#34D399" font-family="monospace" font-size="11.5" font-weight="700">&#9679; 460+ Total Contributions</text>
    <text x="280" y="19.5" fill="#DDD6FE" font-family="monospace" font-size="11.5">&#8226; Active Production Repositories</text>
    <text x="560" y="19.5" fill="#9D62FF" font-family="monospace" font-size="11.5">&#8226; Daily CI Telemetry Engine</text>
  </g>
</svg>
